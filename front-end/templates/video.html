<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RMR-OCRROO</title>

    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    <!--
     npx @tailwindcss/cli -i ./static/src/input.css -o ./static/dist/output.css --watch
     -->
</head>
<body class="bg-gray-300 m-12 mt-2 h-dvh">
    <main class="flex flex-row justify-center bg-gray-200 px-4 py-3 pb-12 gap-2 h-auto w-full min-w-fit">
        <div class="flex flex-col justify-center items-center w-[80%] mx-auto">
            <label for="video_player" class="w-full text-left font-bold text-2xl">{{ video_id }}</label>
            <div class="rounded w-full">
                <video controls id="video_player" class="rounded-md">
                    <source src="../static/media/{{ video }}" type="video/mp4">
                </video>
                <script>
                    window.onload = () => {
                        let player = document.getElementById("video_player")
                        player.currentTime = parseInt(document.getElementById('video_position').value)
                    };
                </script>
                <input type="hidden" name="video_pos" id="video_position" value="{{ time }}">
                <script>
                    video = document.getElementById('video_player');
                    output = document.getElementById('video_position');
                    video.ontimeupdate = () => {
                        let pos = parseInt(video.currentTime)
                        console.log(pos);
                        output.value = pos;
                    }
                </script>
            </div>
        </div>

    </main>
</body>
</html>
