<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>RMR-OCRROO</title>

    <link rel="stylesheet" href="{{url_for('static',filename='dist/output.css')}}">
    <!--
     npx @tailwindcss/cli -i ./static/src/input.css -o ./static/dist/output.css --watch
     -->
</head>
<body class="bg-gray-300 m-12 mt-2 h-dvh">
    <main class="flex flex-row justify-center bg-gray-200 px-4 py-3 pb-12 gap-2 h-auto w-full min-w-fit">
        <div class="flex flex-col justify-center items-center w-[80%] mx-auto">
            <label for="video_player" class="w-full text-left font-bold text-2xl">{{ video_id }}</label>
            <div class="rounded w-full">
                <video controls id="video_player" class="rounded-md">
                    <source src="../static/media/{{ video }}" type="video/mp4">
                </video>
                <script>
                    window.onload = () => {
                        let player = document.getElementById("video_player")
                        player.currentTime = parseInt(document.getElementById('video_position').value)
                    };
                </script>
            </div>
            <div class="w-full flex flex-row justify-end p-1">
                <a href="{{ '/' }}" class="bg-white p-2 lg:p-4 rounded-lg
                          focus:bg-zinc-400 hover:bg-gray-400
                          ease-in-out transition-colors duration-250
                          flex text-sm font-medium justify-center
                          shadow-md w-fit">
                    Select a new video
                </a>
            </div>
        </div>
        <div class="flex flex-col justify-start gap-1 w-[20%]">
             <div class="flex flex-row justify-between rounded w-full">
                <label for="TranscriptArea" class="font-bold text-lg mt-auto">Transcript:</label>
                <div class="rounded bg-green max-w-min">
                    <form action="/video/{{ video_id }}/generate-transcript" class="max-w-max flex flex-col"
                          method="POST">
                        <button id="submit_button"
                                type="submit"
                                class="bg-green-500 whitespace-nowrap lg:p-1 rounded-lg
                              focus:bg-green-400 hover:bg-green-400
                              ease-in-out transition-colors duration-250
                              flex text-white  text-sm font-bold justify-center
                              shadow-md w-full h-fit [-webkit-text-stroke:0.2px_#000000]">
                            Get Transcript
                        </button>
                        <input type="hidden" name="video_pos" id="video_position" value="{{ time }}">
                        <script>
                            video = document.getElementById('video_player');
                            output = document.getElementById('video_position');
                            video.ontimeupdate = () => {
                                let pos = parseInt(video.currentTime)
                                console.log(pos);
                                output.value = pos;
                            }
                        </script>
                    </form>
            </div>
             </div>
            <div class="flex flex-row justify-start rounded w-full h-full text-left p-2 bg-white">
                <textarea name="transcriptArea" id="TranscriptArea"
                          class="p-2 rounded whitespace-pre-wrap w-full h-full text-sm text-left bg-white"
                          rows="10"
                          readonly>{% if transcript %}{{ transcript }}{% else %}No transcript available{% endif %}
                </textarea>
            </div>
        </div>
    </main>
</body>
</html>
